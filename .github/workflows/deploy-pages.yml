name: Deploy SolarEX rebuild preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solarex-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SolarEX rebuild preview artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Copy the current main working tree as the preview source.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'reports' \
            --exclude 'project-memory' \
            --exclude 'backend-domeneshop' \
            --exclude 'validation' \
            --exclude 'SolarEX_v5_website_build_package_20260612_2200.zip' \
            --exclude 'package.json' \
            --exclude '.gitignore'

          touch _site/.nojekyll

          # GitHub Pages project sites run below /solarex/. Rewrite root-relative preview paths.
          find _site -name "*.html" -type f -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/solarex/|g' \
            -e 's|src="/|src="/solarex/|g' \
            -e 's|content="/|content="/solarex/|g'

          test -f _site/index.html
          test -d _site/assets
          test ! -d _site/backend-domeneshop
          ! grep -RniE "(api[_-]?key[[:space:]]*=|db_password[[:space:]]*=|password[[:space:]]*=|secret[[:space:]]*=|token[[:space:]]*=|BEGIN .*PRIVATE KEY|config.local.php)" _site || exit 1

          echo "SolarEX main preview artifact prepared."
          find _site -maxdepth 2 -type f | sort | head -80

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
